name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aggiorna versione e URL in module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "$BASE" \
             --arg manifest "$BASE/releases/latest/download/module.json" \
             --arg download "$BASE/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $v | .url = $url | .manifest = $manifest | .download = $download' \
             module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Crea module.zip
        run: zip -r module.zip module.json scripts icons README.md

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
